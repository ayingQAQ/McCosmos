name: Validate McCosmos
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm skill:build
      - run: pnpm skill:verify
      - run: pnpm illustrations:export
      - run: pnpm verify:contest
      - uses: actions/upload-artifact@v4
        with:
          name: mccosmos-static
          path: dist/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: food-illustrations-svg
          path: artifacts/food-illustrations/
          retention-days: 30
