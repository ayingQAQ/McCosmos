name: Validate McCosmos
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    container:
      # Keep this version aligned with the pinned playwright dependency.
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Trust checked-out workspace in container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm verify:core
      - run: pnpm build
      - run: pnpm skill:build
      - run: pnpm skill:verify
      - run: pnpm illustrations:export
      - run: pnpm verify:contest
      - run: pnpm verify:web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-evidence
          path: artifacts/verification/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: mccosmos-static
          path: dist/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: food-illustrations-svg
          path: artifacts/food-illustrations/
          retention-days: 30
  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check deployment credentials
        id: credentials
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo '### Website deployment pending' >> "$GITHUB_STEP_SUMMARY"
            echo 'Validated artifact is ready. Configure CLOUDFLARE_API_TOKEN (Pages Edit for the project account) and CLOUDFLARE_ACCOUNT_ID to enable automatic production deployment.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/setup-node@v4
        if: steps.credentials.outputs.ready == 'true'
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        if: steps.credentials.outputs.ready == 'true'
        with:
          name: mccosmos-static
          path: site
      - name: Publish checked artifact
        if: steps.credentials.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4.152.0 whoami
          npx --yes wrangler@4.152.0 pages deploy site --project-name=mccosmos --branch=main --commit-hash="$GITHUB_SHA"
      - name: Check published version
        if: steps.credentials.outputs.ready == 'true'
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          node --input-type=module <<'NODE'
          for (let attempt = 0; attempt < 12; attempt++) {
            try {
              const response = await fetch(`https://mccosmos.pages.dev/release.json?sha=${process.env.EXPECTED_SHA}`, { signal: AbortSignal.timeout(10000) });
              if (response.ok && (await response.json()).commit === process.env.EXPECTED_SHA) process.exit(0);
            } catch { /* Retry edge propagation or transient network errors. */ }
            await new Promise(resolve => setTimeout(resolve, 5000));
          }
          throw new Error('Production release does not match the validated commit');
          NODE
