name: Validate McCosmos Skill
on:
  push:
    paths: ['skills/**', 'src/cli/**', 'src/core/**', 'src/graph/analysis.ts', 'src/data/**', 'src/mcp/**', 'scripts/*skill*', 'scripts/cosmos-cli.ts', 'package.json', 'pnpm-lock.yaml', '.github/workflows/skill.yml']
  workflow_dispatch:
    inputs:
      skill_args:
        description: 'Optional Agent-selected CLI arguments as a JSON array; snapshot mode only, no credentials.'
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: skill-${{ github.ref }}
  cancel-in-progress: true
jobs:
  skill:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm skill:build
      - run: pnpm skill:verify
      - run: node scripts/skill-agent-smoke.mjs
        if: github.event_name == 'workflow_dispatch' && inputs.skill_args != ''
        env:
          MCCOSMOS_SKILL_ARGS: ${{ inputs.skill_args }}
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && inputs.skill_args != ''
        with:
          name: skill-agent-invocation
          path: artifacts/skill-agent/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: mccosmos-skill
          path: dist-skill/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: skill-acceptance
          path: artifacts/skill/
          retention-days: 30
