    <rect x="239" y="27" width="184" height="104" rx="16"/>
    <rect x="458" y="27" width="184" height="104" rx="16"/>
    <rect x="677" y="27" width="184" height="104" rx="16"/>
    <rect x="896" y="27" width="184" height="104" rx="16"/>
  </g>
  <g fill="none" stroke="#C49351" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M213 79h16m-5-5 5 5-5 5"/>
    <path d="M432 79h16m-5-5 5 5-5 5"/>
    <path d="M651 79h16m-5-5 5 5-5 5"/>
    <path d="M870 79h16m-5-5 5 5-5 5"/>
